name: bolt
description: "Um cliente API REST moderno, leve e nativo para Windows e Linux."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  
  # Gerenciamento de Estado Reativo
  flutter_riverpod: ^2.6.1
  
  # Cliente HTTP Robusto (com interceptors e suporte avançado)
  dio: ^5.7.0
  
  # Banco de Dados Local NoSQL ultrarrápido para salvar coleções e histórico
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  
  # Utilitários de UI para Desktop (Divisores/Split views)
  two_dimensional_scrollables: ^0.3.5
  path_provider: ^2.1.6
  file_selector: 1.0.3
  yaml: ^3.1.4

  # Code Editor com syntax highlighting
  re_editor: ^0.10.0
  re_highlight: ^0.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  
  # Geradores de código para o Isar
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: SFProDisplay
      fonts:
        - asset: assets/fonts/SFPRODISPLAYREGULAR.OTF
          weight: 400
        - asset: assets/fonts/SFPRODISPLAYMEDIUM.OTF
          weight: 500
        - asset: assets/fonts/SFPRODISPLAYBOLD.OTF
          weight: 700